<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fawakihAI - قسم الشحن تحت الصيانة</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #070312;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* خلفية الأشرطة المتحركة بكامل الشاشة بنمط النيون البنفسجي والوردي */
        .animated-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
            opacity: 0.22;
        }
        .stripe {
            position: absolute;
            width: 200%;
            height: 50px;
            background: linear-gradient(90deg, #a855f7, #ec4899, #6366f1, #a855f7);
            background-size: 400% 100%;
            animation: moveStripes 10s linear infinite;
        }
        .stripe:nth-child(1) { top: 10%; transform: rotate(-15deg); animation-duration: 12s; }
        .stripe:nth-child(2) { top: 35%; transform: rotate(-15deg); animation-duration: 8s; }
        .stripe:nth-child(3) { top: 60%; transform: rotate(-15deg); animation-duration: 14s; }
        .stripe:nth-child(4) { top: 85%; transform: rotate(-15deg); animation-duration: 10s; }

        @keyframes moveStripes {
            0% { background-position: 0% 50%; }
            100% { background-position: 100% 50%; }
        }

        /* حاوية المحتوى المركزية بتأثير الزجاج الداكن واللمسات البنفسجية */
        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            background: rgba(18, 10, 32, 0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(168, 85, 247, 0.25);
            padding: 50px 40px;
            border-radius: 28px;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 25px 60px rgba(5, 2, 10, 0.8), 0 0 35px rgba(168, 85, 247, 0.15);
            animation: fadeIn 1.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* اسم التطبيق بتدرج نيون بنفسجي ووردي متطور */
        .brand-name {
            font-size: 3rem;
            font-weight: 800;
            background: linear-gradient(135deg, #d8b4fe, #ec4899, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            filter: drop-shadow(0 0 15px rgba(168, 85, 247, 0.4));
        }

        /* الرسمة البرمجية التفاعلية */
        .code-graphic {
            width: 100px;
            height: 100px;
            margin: 0 auto 20px auto;
            animation: pulseGlow 3s ease-in-out infinite;
        }
        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 12px rgba(168, 85, 247, 0.6)); }
            50% { transform: scale(1.08); filter: drop-shadow(0 0 28px rgba(236, 72, 153, 0.9)); }
        }

        /* العناوين والنصوص */
        h2 {
            font-size: 1.7rem;
            margin-bottom: 15px;
            color: #f3f4f6;
            font-weight: 700;
        }
        p {
            font-size: 1.15rem;
            color: #d1d5db;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* زر التحديث والتفاعل بنمط النيون الساطع */
        .btn {
            display: inline-block;
            padding: 14px 35px;
            background: linear-gradient(135deg, #9333ea, #db2777);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(147, 51, 234, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 30px rgba(219, 39, 119, 0.8), 0 0 15px rgba(168, 85, 247, 0.6);
            background: linear-gradient(135deg, #a855f7, #e11d48);
        }
    </style>
</head>
<body>
    <!-- الخلفية ذات الأشرطة المتحركة -->
    <div class="animated-bg">
        <div class="stripe"></div>
        <div class="stripe"></div>
        <div class="stripe"></div>
        <div class="stripe"></div>
    </div>

    <!-- صندوق المحتوى -->
    <div class="container">
        <!-- الرسمة البرمجية -->
        <div class="code-graphic">
            <svg viewBox="0 0 24 24" fill="none" stroke="#d8b4fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="16 18 22 12 16 6"></polyline>
                <polyline points="8 6 2 12 8 18"></polyline>
                <line x1="14" y1="4" x2="10" y2="20"></line>
            </svg>
        </div>

        <h1 class="brand-name">fawakihAI</h1>
        <h2>قسم الشحن تحت الصيانة</h2>
        <p>عزيزي العميل، نحن نعمل بجهد كبير لتطوير ورفع كفاءة نظام الشحن لخدمتكم بشكل أفضل. يرجى التحلي بالصبر، وشكراً لثقتكم المستمرة.</p>
        
        <a href="#" class="btn" onclick="window.location.reload();">تحديث الصفحة</a>
    </div>
</body>
</html>
