<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرضي الاحترافي</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* 1. التنسيقات العامة والخلفية */
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); /* خلفية متدرجة فخمة */
      color: #fff;
      text-align: center;
      font-family: 'Tajawal', sans-serif; /* تطبيق الخط الجديد */
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden; /* منع التمرير الأفقي للصفحة كاملة */
    }

    /* 2. تنسيق النصوص والعناوين */
    h1 {
      margin: 40px 0 10px;
      font-size: 2.5rem;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: fadeIn 2s ease-in-out;
    }
    
    p.subtitle {
      color: #ccc;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    /* 3. شريط الصور المتحرك (Infinite Scroll Slider) */
    .slider-container {
      background: rgba(255, 255, 255, 0.05); /* خلفية شفافة للشريط */
      padding: 20px 0;
      margin: 30px 0;
      overflow: hidden; /* إخفاء ما يخرج عن الإطار */
      position: relative;
      width: 100%;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    .slider-track {
      display: flex;
      gap: 20px; /* المسافة بين الصور */
      width: calc(250px * 10); /* عرض تقريبي لعدد الصور */
      animation: scroll 20s linear infinite; /* سرعة الحركة */
    }

    .slide {
      height: 150px;
      width: 250px;
      flex-shrink: 0; /* منع تقلص الصور */
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.2);
      transition: transform 0.3s;
    }
    
    .slide img:hover {
      transform: scale(1.05); /* تكبير بسيط عند المرور */
      border-color: #fff;
    }

    /* أنيميشن التحرك */
    @keyframes scroll {
      0% {
        transform: translateX(0);
      }
      100% {
        transform: translateX(calc(-250px * 5 - 100px)); /* تعديل الحساب بناء على عدد الصور */
      }
    }

    /* 4. معرض الصور الثابت (الشبكة) */
    .gallery-title {
      border-bottom: 2px solid #ff9800;
      display: inline-block;
      padding-bottom: 5px;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px 50px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(255, 152, 0, 0.4); /* توهج برتقالي عند التحويم */
    }

    /* 5. زر الواتساب */
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      margin: 40px auto 60px;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      transition: background 0.3s, transform 0.3s;
    }

    .whatsapp-btn:hover {
      background-color: #128C7E;
      transform: scale(1.05);
    }

    /* تأثير الظهور للنصوص */
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

  </style>
</head>

<body>

  <h1>مرحباً بكم في موقعي</h1>
  <p class="subtitle">نقدم لكم أفضل التصاميم والصور بجودة عالية</p>

  <div class="slider-container">
    <div class="slider-track">

      <div class="slide"><img src="images/Screenshot_٢٠٢٦٠١٣٠-١١١٠١١.jpg" alt="إعلان 2"></div>

      <div class="slide"><img src="https://via.placeholder.com/250x150/4caf50/fff?text=صورة+5" alt="إعلان 5"></div>

      <div class="slide"><img src="images/IMG_20260117_061812_292.webp" alt="إعلان 1"></div>
      <div class="slide"><img src="images/Screenshot_٢٠٢٦٠١٣٠-١١١٠١١.jpg" alt="إعلان 2"></div>
      <div class="slide"><img src="https://via.placeholder.com/250x150/ff5722/fff?text=صورة+3" alt="إعلان 3"></div>
      <div class="slide"><img src="https://via.placeholder.com/250x150/2196f3/fff?text=صورة+4" alt="إعلان 4"></div>
      <div class="slide"><img src="https://via.placeholder.com/250x150/4caf50/fff?text=صورة+5" alt="إعلان 5"></div>
    </div>

</body>
</html>
