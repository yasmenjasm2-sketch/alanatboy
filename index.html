<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أعمالنا</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">

  <style>
    /* التنسيقات العامة ومنع التفاعل */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      height: 100vh;
      overflow: hidden; 
      position: relative;
      touch-action: none;
    }

    /* طبقة الحماية المخفية */
    .touch-shield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: transparent;
      cursor: default;
    }

    /* عنوان الصفحة المضيء (بحجم أصغر ومتناسق) */
    .title-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 10px 0; /* تقليل المسافة العلوية */
      background: linear-gradient(to bottom, rgba(15,32,39,1) 0%, rgba(15,32,39,0.7) 60%, transparent 100%);
      z-index: 1000;
      pointer-events: none;
    }

    .main-title {
      font-size: 1.6rem; /* تصغير حجم الخط ليتناسب مع الودجت */
      font-weight: 900;
      background: linear-gradient(45deg, #fff, #ff9800, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 3px 10px rgba(255, 152, 0, 0.4);
      letter-spacing: 1px;
      animation: pulseGlow 3s infinite alternate;
      margin-top: 5px;
    }

    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 5px rgba(255, 152, 0, 0.4)); transform: scale(1); }
      100% { filter: drop-shadow(0 0 15px rgba(255, 152, 0, 0.8)); transform: scale(1.02); }
    }

    /* حاوية العرض الأفقية */
    .gallery-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center; 
      direction: ltr; 
      mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 10%, black 90%, transparent 100%);
    }

    .scrolling-track {
      display: flex;
      flex-direction: row; 
      align-items: center;
      gap: 15px; /* تقليل المسافة بين الصور */
      width: max-content; 
      animation: scrollLeftToRight 25s linear infinite; /* تسريع بسيط للحركة لتناسب الحجم الصغير */
      will-change: transform; 
    }

    @keyframes scrollLeftToRight {
      0% { transform: translateX(-50%) translateZ(0); }
      100% { transform: translateX(0) translateZ(0); } 
    }

    /* تنسيق الصور (تصغير الحجم بشكل احترافي) */
    .image-card {
      width: 120px; /* تم تصغير العرض */
      height: 240px; /* تم تصغير الطول */
      flex-shrink: 0; 
      border-radius: 12px; /* تصغير دقة الحواف */
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5); /* تخفيف الظل */
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 4px; /* تقليل الحشوة الداخلية */
      backdrop-filter: blur(5px); 
      -webkit-backdrop-filter: blur(5px);
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover; 
      border-radius: 8px; /* تصغير حواف الصورة الداخلية */
      display: block;
      pointer-events: none;
    }

    /* تأثير الجسيمات في الخلفية */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255, 152, 0, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(37, 211, 102, 0.08) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="touch-shield"></div>

  <div class="bg-particles"></div>

  <div class="title-container">
    <h1 class="main-title">أعمالنا</h1>
  </div>

  <div class="gallery-viewport">
    <div class="scrolling-track" id="auto-scroll-track">
      <div class="image-card"><img src="images/1767593909689.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1767218139132.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1767184659221.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/Screenshot_١٩٣٧٥١-٢-٢١-١٢.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/IMG_20260117_061812_292.webp" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1769838671987.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1769830307172.png" alt="اعمالنا"></div>
    </div>
  </div>

  <script>
    // النسخ الذكي لضمان تكرار لا نهائي وسلس
    const track = document.getElementById('auto-scroll-track');
    track.innerHTML += track.innerHTML;

    // حماية إضافية عبر الجافاسكربت لمنع أي محاولة للتفاعل
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    document.addEventListener('keydown', event => {
      if (event.ctrlKey && ['a', 'c', 'u', 's'].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
      }
    });

    // منع التمرير واللمس بجميع أشكاله
    window.addEventListener('wheel', event => event.preventDefault(), { passive: false });
    window.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
    window.addEventListener('touchstart', event => event.preventDefault(), { passive: false });
  </script>

</body>
</html>
