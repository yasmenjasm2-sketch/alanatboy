  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  <style>
    /* 1. التنسيقات العامة */
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      margin: 40px 0 10px;
      font-size: 2.5rem;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: fadeIn 2s ease-in-out;
    }
    
    p.subtitle {
      color: #ccc;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    /* 2. شريط الصور المتحرك (Infinite Scroll Slider) */
    .slider-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px 0;
      margin: 30px 0;
      overflow: hidden;
      position: relative;
      width: 100%;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    .slider-track {
      display: flex;
      gap: 20px; /* المسافة بين الصور */
      /* الحساب الدقيق للحركة:
         عرض الصورة (250) + الفراغ (20) = 270 بكسل
         عدد الصور الكلي (الأصلية + المكررة) = 12 صورة
         العرض الكلي = 270 * 12 = 3240px
      */
      width: calc(270px * 12); 
      animation: scroll 20s linear infinite;
      
      /* مهم جداً: جعل اتجاه الشريط من اليسار لليمين لضمان عمل الحركة بشكل صحيح في المواقع العربية */
      direction: ltr; 
    }

    .slide {
      height: 150px;
      width: 250px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
      border: 2px solid rgba(255,255,255,0.2);
      transition: transform 0.3s;
    }
    
    .slide img:hover {
      transform: scale(1.05);
      border-color: #fff;
    }

    /* حركة الشريط:
       يتحرك بمقدار عرض الـ 6 صور الأصلية فقط (-1620px)
       وعندما يصل للنهاية يعود للصفر فوراً، وبما أن الصور مكررة فلا تلاحظ العين ذلك.
    */
    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-270px * 6)); } 
    }

    /* 3. معرض الصور الثابت */
    .gallery-title {
      border-bottom: 2px solid #ff9800;
      display: inline-block;
      padding-bottom: 5px;
      margin-bottom: 30px;
      margin-top: 50px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 20px;
      padding: 20px 50px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      height: 200px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: all 0.3s ease;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 20px rgba(255, 152, 0, 0.4);
    }

    /* 4. زر الواتساب */
    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px 30px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      margin: 60px auto;
      box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
      transition: background 0.3s, transform 0.3s;
    }

    .whatsapp-btn:hover {
      background-color: #128C7E;
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
