<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>معرضي الاحترافي المحدث</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      text-align: center;
      font-family: 'Tajawal', sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      margin: 40px 0 10px;
      font-size: 2.5rem;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      animation: fadeIn 2s ease-in-out;
    }
    
    p.subtitle {
      color: #ccc;
      margin-bottom: 40px;
      font-size: 1.1rem;
    }

    /* شريط الصور المتحرك */
    .slider-container {
      background: rgba(255, 255, 255, 0.05);
      padding: 20px 0;
      margin: 30px 0;
      overflow: hidden;
      position: relative;
      width: 100%;
      box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(5px);
    }

    .slider-track {
      display: flex;
      gap: 20px;
      /* تم تعديل العرض ليتناسب مع زيادة عدد الصور */
      width: calc(300px * 16); 
      animation: scroll 35s linear infinite;
    }

    .slide {
      height: 180px;
      width: 280px;
      flex-shrink: 0;
    }

    .slide img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      border: 2px solid rgba(255,255,255,0.2);
      transition: 0.3s;
    }

    @keyframes scroll {
      0% { transform: translateX(0); }
      100% { transform: translateX(calc(-280px * 8 - 160px)); }
    }

    /* معرض الصور الثابت */
    .gallery-title {
      border-bottom: 2px solid #ff9800;
      display: inline-block;
      padding-bottom: 5px;
      margin-bottom: 30px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      padding: 20px 50px;
      max-width: 1200px;
      margin: 0 auto;
    }

    .gallery img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      border-radius: 15px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.5);
      transition: 0.3s;
    }

    .gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 10px 20px rgba(255, 152, 0, 0.3);
    }

    .whatsapp-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background-color: #25D366;
      color: white;
      text-decoration: none;
      padding: 15px 35px;
      border-radius: 50px;
      font-size: 1.2rem;
      font-weight: bold;
      margin: 40px 0 60px;
      transition: 0.3s;
    }

    .whatsapp-btn:hover { background-color: #128C7E; transform: scale(1.05); }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  </style>
</head>

<body>

  <h1>مرحباً بكم في موقعي المحدث</h1>
  <p class="subtitle">استعراض أحدث التصاميم المضافة</p>

  <div class="slider-container">
    <div class="slider-track">
      <div class="slide"><img src="images/Screenshot_٢٠٢٦٠١٣٠-١٩٢٩١٣.jpg" alt="صورة 1"></div>
      <div class="slide"><img src="images/IMG_20260117_061812_292.webp" alt="صورة 2"></div>
      <div class="slide"><img src="images/Screenshot_٢٠٢٦٠١٣٠-١١١٠١١.jpg" alt="صورة 3"></div>
      
      <div class="slide"><img src="images/Screenshot_١٩٥٣٣٥-٢٠٢٦٠١٣٠.jpg" alt="صورة جديدة 1"></div>
      <div class="slide"><img src="images/Screenshot_٢٠٠١٥٠-٢٠٢٦٠١٣٠.jpg" alt="صورة جديدة 2"></div>
      
      <div class="slide"><img src="images/Screenshot_٢٠٢٦٠١٣٠-١٩٢٩١٣.jpg" alt="صورة 1"></div>
      <div class="slide"><img src="images/Screenshot_١٩٥٣٣٥-٢٠٢٦٠١٣٠.jpg" alt="صورة جديدة 1"></div>
      <div class="slide"><img src="images/Screenshot_٢٠٠١٥٠-٢٠٢٦٠١٣٠.jpg" alt="صورة جديدة 2"></div>
    </div>
  </div>

  <h2 class="gallery-title">المعرض الكامل</h2>
  
  <div class="gallery">
    <img src="images/Screenshot_٢٠٢٦٠١٣٠-١٩٢٩١٣.jpg" alt="صورة 1">
    <img src="images/IMG_20260117_061812_292.webp" alt="صورة 2">
    <img src="images/Screenshot_٢٠٢٦٠١٣٠-١١١٠١١.jpg" alt="صورة 3">
    
    <img src="images/Screenshot_١٩٥٣٣٥-٢٠٢٦٠١٣٠.jpg" alt="صورة جديدة 1">
    <img src="images/Screenshot_٢٠٠١٥٠-٢٠٢٦٠١٣٠.jpg" alt="صورة جديدة 2">
  </div>

  <a href="https://wsend.co/905424678123" class="whatsapp-btn" target="_blank">
    تواصل معنا عبر واتساب 💬
  </a>

</body>
</html>
