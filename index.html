<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أعمالنا</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">

  <style>
    /* 1. التنسيقات العامة ومنع التفاعل */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      /* منع تحديد النصوص والصور */
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      height: 100vh;
      overflow: hidden; /* إخفاء أشرطة التمرير تماماً */
      position: relative;
      touch-action: none; /* منع إيماءات اللمس */
    }

    /* طبقة الحماية المخفية - تمنع أي لمس أو نقر على الشاشة */
    .touch-shield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: transparent;
      cursor: default;
    }

    /* 2. عنوان الصفحة المضيء */
    .title-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 25px 0;
      background: linear-gradient(to bottom, rgba(15,32,39,1) 0%, rgba(15,32,39,0) 100%);
      z-index: 1000;
      pointer-events: none;
    }

    .main-title {
      font-size: 3.5rem;
      font-weight: 900;
      background: linear-gradient(45deg, #fff, #ff9800, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 5px 20px rgba(255, 152, 0, 0.4);
      letter-spacing: 2px;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { text-shadow: 0 5px 20px rgba(255, 152, 0, 0.4); transform: scale(1); }
      100% { text-shadow: 0 5px 40px rgba(255, 152, 0, 0.8); transform: scale(1.02); }
    }

    /* 3. حاوية العرض المتحركة (من الأسفل للأعلى) */
    .gallery-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 120px; /* مسافة للعنوان */
      mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .scrolling-track {
      display: flex;
      flex-direction: column;
      gap: 30px;
      width: 90%;
      max-width: 800px;
      /* حركة لا نهائية سلسة - يمكنك تعديل 40s لتسريع أو إبطاء الحركة */
      animation: scrollUpBottom 30s linear infinite;
    }

    @keyframes scrollUpBottom {
      0% { transform: translateY(0); }
      /* يتحرك بنسبة 50% لأننا سنقوم بنسخ الصور بالبرمجة ليصبح الطول الضعف */
      100% { transform: translateY(-50%); } 
    }

    /* تنسيق الصور */
    .image-card {
      width: 100%;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 10px;
    }

    .image-card img {
      width: 100%;
      height: auto;
      border-radius: 15px;
      display: block;
      pointer-events: none; /* منع سحب الصور */
    }

    /* تأثير الجسيمات في الخلفية */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255, 152, 0, 0.05) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(37, 211, 102, 0.05) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* للشاشات الصغيرة */
    @media (max-width: 768px) {
      .main-title { font-size: 2.5rem; }
      .scrolling-track { gap: 20px; }
      .image-card { padding: 5px; border-radius: 15px; }
      .image-card img { border-radius: 10px; }
    }
  </style>
</head>
<body>

  <!-- طبقة الحماية التي تمنع اللمس نهائياً -->
  <div class="touch-shield"></div>

  <!-- خلفية جمالية -->
  <div class="bg-particles"></div>

  <!-- العنوان الوحيد في الصفحة -->
  <div class="title-container">
    <h1 class="main-title">أعمالنا</h1>
  </div>

  <!-- حاوية الصور المتحركة -->
  <div class="gallery-viewport">
    <div class="scrolling-track" id="auto-scroll-track">
      <!-- ضع جميع صورك هنا (بدون أي نصوص) -->
      <div class="image-card"><img src="images/1767593909689.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1767218139132.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1767184659221.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/Screenshot_١٩٣٧٥١-٢-٢١-١٢.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/IMG_20260117_061812_292.webp" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1769838671987.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1769830307172.png" alt="اعمالنا"></div>
    </div>
  </div>

  <script>
    // 1. تقنية النسخ الذكي لضمان تكرار لا نهائي وسلس (Seamless Loop)
    const track = document.getElementById('auto-scroll-track');
    // نقوم بنسخ محتوى الصور ولصقه مرة أخرى داخل نفس الحاوية
    // هذا يجعل حركة الـ CSS تستمر دون انقطاع أو وميض أبيض
    track.innerHTML += track.innerHTML;

    // 2. حماية إضافية عبر الجافاسكربت لمنع أي محاولة للتفاعل
    
    // منع النقر بزر الماوس الأيمن (القائمة المنسدلة)
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    // منع اختصارات لوحة المفاتيح المتعلقة بالتحديد أو النسخ
    document.addEventListener('keydown', event => {
      // منع Ctrl+A, Ctrl+C, Ctrl+U, Ctrl+S
      if (event.ctrlKey && ['a', 'c', 'u', 's'].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
      // منع أزرار الأسهم والمسطرة للتمرير
      if (['ArrowUp', 'ArrowDown', 'PageUp', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
      }
    });

    // منع حركة التمرير بعجلة الماوس
    window.addEventListener('wheel', event => event.preventDefault(), { passive: false });

    // منع السحب باللمس على الشاشات
    window.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
  </script>

</body>
</html>
