<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أعمالنا</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">

  <style>
    /* 1. التنسيقات العامة ومنع التفاعل */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      height: 100vh;
      overflow: hidden; 
      position: relative;
      touch-action: none;
    }

    /* طبقة الحماية المخفية */
    .touch-shield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
      background: transparent;
      cursor: default;
    }

    /* 2. عنوان الصفحة المضيء */
    .title-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      text-align: center;
      padding: 20px 0;
      /* تدرج لوني أطول لدمج العنوان مع الخلفية */
      background: linear-gradient(to bottom, rgba(15,32,39,1) 0%, rgba(15,32,39,0.8) 50%, transparent 100%);
      z-index: 1000;
      pointer-events: none;
    }

    .main-title {
      font-size: 3rem;
      font-weight: 900;
      background: linear-gradient(45deg, #fff, #ff9800, #fff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 5px 20px rgba(255, 152, 0, 0.4);
      letter-spacing: 2px;
      animation: pulseGlow 3s infinite alternate;
    }

    @keyframes pulseGlow {
      0% { filter: drop-shadow(0 0 10px rgba(255, 152, 0, 0.4)); transform: scale(1); }
      100% { filter: drop-shadow(0 0 25px rgba(255, 152, 0, 0.8)); transform: scale(1.02); }
    }

    /* 3. حاوية العرض الأفقية المتحركة */
    .gallery-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center; /* توسيط الصور عمودياً */
      /* إجبار الاتجاه من اليسار لليمين برمجياً لضمان دقة الحركة */
      direction: ltr; 
      /* تدرج إخفاء من اليمين واليسار (Fade edges) */
      mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
      -webkit-mask-image: linear-gradient(to right, transparent 0%, black 15%, black 85%, transparent 100%);
    }

    .scrolling-track {
      display: flex;
      flex-direction: row; /* عرض الصور أفقياً بجانب بعضها */
      align-items: center;
      gap: 30px;
      width: max-content; /* يأخذ عرض الصور بالكامل */
      /* حركة من اليسار لليمين */
      animation: scrollLeftToRight 30s linear infinite;
      /* تفعيل تسريع المعالج الرسومي */
      will-change: transform; 
    }

    /* أنيميشن الحركة الأفقية المستمرة (من اليسار لليمين) */
    @keyframes scrollLeftToRight {
      0% { transform: translateX(-50%) translateZ(0); } /* يبدأ من النصف المنسوخ باليسار */
      100% { transform: translateX(0) translateZ(0); } /* يتجه نحو اليمين */
    }

    /* تنسيق الصور (تصميم زجاجي عصري) */
    .image-card {
      /* تحديد أبعاد متناسقة مع شاشات الهواتف */
      width: 260px; 
      height: 520px; 
      flex-shrink: 0; /* منع انضغاط الصور */
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px;
      /* تأثير زجاجي خفيف */
      backdrop-filter: blur(5px); 
      -webkit-backdrop-filter: blur(5px);
    }

    .image-card img {
      width: 100%;
      height: 100%;
      object-fit: cover; /* ملء الإطار مع الحفاظ على الجودة */
      border-radius: 14px;
      display: block;
      pointer-events: none;
    }

    /* تأثير الجسيمات في الخلفية */
    .bg-particles {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at 20% 50%, rgba(255, 152, 0, 0.08) 0%, transparent 50%),
                  radial-gradient(circle at 80% 80%, rgba(37, 211, 102, 0.08) 0%, transparent 50%);
      z-index: 0;
      pointer-events: none;
    }

    /* للشاشات الصغيرة والمتوسطة */
    @media (max-width: 768px) {
      .main-title { font-size: 2.2rem; }
      .scrolling-track { gap: 20px; }
      .image-card { 
        width: 220px; 
        height: 450px; 
        padding: 5px; 
      }
      .image-card img { border-radius: 12px; }
    }
  </style>
</head>
<body>

  <div class="touch-shield"></div>

  <div class="bg-particles"></div>

  <div class="title-container">
    <h1 class="main-title">أعمالنا</h1>
  </div>

  <div class="gallery-viewport">
    <div class="scrolling-track" id="auto-scroll-track">
      <div class="image-card"><img src="images/1767593909689.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1767218139132.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1767184659221.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/Screenshot_١٩٣٧٥١-٢-٢١-١٢.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/IMG_20260117_061812_292.webp" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1769838671987.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1769830307172.png" alt="اعمالنا"></div>
    </div>
  </div>

  <script>
    // 1. تقنية النسخ الذكي لضمان تكرار لا نهائي وسلس (Seamless Loop)
    const track = document.getElementById('auto-scroll-track');
    track.innerHTML += track.innerHTML;

    // 2. حماية إضافية عبر الجافاسكربت لمنع أي محاولة للتفاعل
    document.addEventListener('contextmenu', event => event.preventDefault());
    
    document.addEventListener('keydown', event => {
      if (event.ctrlKey && ['a', 'c', 'u', 's'].includes(event.key.toLowerCase())) {
        event.preventDefault();
      }
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'PageUp', 'PageDown', ' '].includes(event.key)) {
        event.preventDefault();
      }
    });

    // منع التمرير واللمس بجميع أشكاله لضمان بقاء العرض السينمائي
    window.addEventListener('wheel', event => event.preventDefault(), { passive: false });
    window.addEventListener('touchmove', event => event.preventDefault(), { passive: false });
    window.addEventListener('touchstart', event => event.preventDefault(), { passive: false });
  </script>

</body>
</html>
