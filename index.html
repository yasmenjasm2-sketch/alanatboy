<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>أعمالنا - فواكه AI</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@700;900&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-user-select: none;
      user-select: none;
      -webkit-user-drag: none;
    }

    body {
      background: linear-gradient(135deg, #0F051D, #2A0B4E, #0F051D);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      height: 100vh;
      overflow: hidden; 
      position: relative;
      touch-action: none;
    }

    .touch-shield {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 9999;
    }

    .gallery-viewport {
      position: absolute;
      top: 0; /* لضمان التوسيط في الشاشة */
      left: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center; 
      direction: ltr; 
    }

    .scrolling-track {
      display: flex;
      flex-direction: row; 
      align-items: center;
      gap: 0px; /* إزالة الفراغات تماماً بين الصور */
      width: max-content; 
      animation: scrollLeftToRight 25s linear infinite;
    }

    @keyframes scrollLeftToRight {
      0% { transform: translateX(0); }
      100% { transform: translateX(-50%); } 
    }

    /* السر هنا لتصغير المحيط (البوكس) على مقاس الصورة بالضبط */
    .image-card {
      height: 250px; /* نثبت الارتفاع فقط */
      width: auto;   /* العرض تلقائي ليتقلص المحيط على مقاس الصورة بالضبط بدون أي فراغ إضافي */
      flex-shrink: 0; 
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0px; /* إزالة البادينج لضمان الالتصاق */
    }

    /* عرض الصورة كاملة بدون قص */
    .image-card img {
      height: 100%; /* تأخذ كامل الارتفاع */
      width: auto;  /* العرض يتكيف تلقائياً مع الارتفاع بدون تشويه */
      display: block;
      pointer-events: none;
      border-top: 2px solid #9D4EDD; /* إطار علوي وسفلي فقط للجمالية */
      border-bottom: 2px solid #9D4EDD;
    }
  </style>
</head>
<body>

  <div class="touch-shield"></div>

  <div class="gallery-viewport">
    <div class="scrolling-track" id="auto-scroll-track">
      <!-- تم إضافة صورة 1000168810.jpg كما طلبت -->
      <div class="image-card"><img src="1000168810.jpg" alt="أعمالنا"></div>
      <div class="image-card"><img src="images/1767593909689.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1767218139132.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/1767184659221.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/fame.jpg" alt="اعمالنا"></div>
      <div class="image-card"><img src="images/IMG_20260117_061812_292.webp" alt="اعمالنا"></div>
    </div>
  </div>

  <script>
    const track = document.getElementById('auto-scroll-track');
    // نسخ المحتوى لضمان التكرار اللانهائي السلس
    track.innerHTML += track.innerHTML;
  </script>

</body>
</html>
